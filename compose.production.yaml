services:
  app:
    build: .
    restart: unless-stopped
    env_file: ${STUDENTSHIELD_ENV_FILE:?Set the absolute path to production environment file}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /app/data
    volumes: ["studentshield_data:/app/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      STUDENTSHIELD_DOMAIN: ${STUDENTSHIELD_DOMAIN:?Set your domain}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  studentshield_data:
  caddy_data:
  caddy_config:
