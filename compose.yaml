services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: studentshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studentshield_dev}
      POSTGRES_DB: studentshield
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studentshield"]
      interval: 3s
      retries: 20
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  pgdata:
